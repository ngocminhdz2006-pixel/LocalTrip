<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B7A5D" />
      <stop offset="100%" stop-color="#1E5A44" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- App Background with squircle/rounded corner -->
  <rect width="512" height="512" rx="112" fill="url(#ltGrad)" />

  <!-- Inner Soft Ring -->
  <circle cx="256" cy="240" r="150" fill="none" stroke="#E3F0E8" stroke-width="4" stroke-dasharray="10 10" opacity="0.4" />

  <!-- Location Pin Group with shadow -->
  <g filter="url(#shadow)">
    <!-- Pin Body (Sun yellow #F2B544) -->
    <path d="M256 120 C200 120 156 164 156 220 C156 286 256 384 256 384 C256 384 356 286 356 220 C356 164 312 120 256 120 Z" fill="#F2B544" />
    <!-- Pin Inner Core -->
    <circle cx="256" cy="216" r="44" fill="#FFFFFF" />
    <!-- Brand Initial 'L' inside the pin -->
    <path d="M246 194 V238 H270" fill="none" stroke="#1E5A44" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
